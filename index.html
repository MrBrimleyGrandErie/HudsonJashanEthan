<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta data ---------------------------------------------------- -->
    <meta charset="utf-8">            <!-- Character encoding (UTF‑8) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                <!-- Makes the page responsive on mobile devices -->

    <!-- Page title --------------------------------------------------- -->
    <title>Projects</title>

    <!-- External CSS – put your own stylesheet(s) here if needed -->
<style>
  .card {
    background-color: #08F;
    border: 2px solid #ffffff;
    padding: 30px;      /* Space inside */
    margin-bottom: 10px; /* Push next element down */
    border-radius: 10px; /* Rounded corners */
  }

  html, body {
  margin: 0;
  height: 15%;
}

.container {
  display: grid;
  width: 100vw;
  height:30vh;
  box-sizing: border-box; /* Includes padding in width/height calculations */
  
  /* Row 1 is only as tall as the header needs; Row 2 (main) takes up all remaining height */
  grid-template-rows: auto 1fr;
  grid-template-columns: 200px 1fr;
  background-color: dodgerblue;
  padding: 0px;
  gap: 0px; /* Optional: adds spacing between your grid boxes */
}

.container div {
  background-color: rgb(255, 255, 255);
  padding: 0px;
  font-size: 30px;
  text-align: center;
}

#header {
  grid-column: 2;
  padding: 20px 140px; /* Keeps the header nice and slim */
  background-color:dodgerblue;
}
</style>

<div class="container" id="header">
  <h1>Projects</h1>
</div>
